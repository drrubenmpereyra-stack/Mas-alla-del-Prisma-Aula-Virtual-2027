<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 6 - Infidelidades Digitales y Nuevos Pactos Amorosos</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .btn-volver {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #fadbd8;
            color: #78281f;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(250, 219, 216, 0.8);
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        header h2 {
            font-size: 1.5rem;
            color: #1a252f;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 10px;
            margin-bottom: 8px;
            margin-top: 40px;
        }

        header p {
            font-size: 0.95rem;
            color: #7d6608;
            font-weight: 600;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            display: none;
        }

        .quiz-card.active {
            display: block;
        }

        .question-number {
            font-size: 0.85rem;
            font-weight: 700;
            color: #7d6608;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #fcf3cf;
            border-color: #7d6608;
        }

        .option-btn.correct {
            background-color: #d4efdf !important;
            color: #145a32 !important;
            border-color: #145a32 !important;
            box-shadow: 0 0 10px rgba(212, 239, 223, 0.9);
        }

        .option-btn.incorrect {
            background-color: #f5b7b1 !important;
            color: #641e16 !important;
            border-color: #641e16 !important;
            box-shadow: 0 0 10px rgba(245, 183, 177, 0.9);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct-fb {
            background-color: #d4efdf;
            color: #145a32;
            border: 1.5px solid #145a32;
        }

        .feedback-box.incorrect-fb {
            background-color: #f9d5d2;
            color: #641e16;
            border: 1.5px solid #641e16;
        }

        .nav-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-next {
            background-color: #d4efdf;
            color: #145a32;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(212, 239, 223, 0.8);
            display: none;
            transition: all 0.2s ease;
        }

        .btn-next:hover {
            background-color: #a9dfbf;
        }

        .results-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none;
        }

        .results-card h3 {
            font-size: 1.6rem;
            color: #1a252f;
            margin-bottom: 15px;
        }

        .results-card p {
            font-size: 1.1rem;
            color: #7d6608;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .msg-status {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="btn-volver" onclick="volverDashboard()">← Volver</button>
            <h2>Test 6: Infidelidades Digitales y Nuevos Pactos Amorosos</h2>
            <p>Programa de Formación para Profesionales de la Salud Mental (2027)</p>
        </header>

        <!-- Contenedor del Cuestionario -->
        <div id="questionsContainer"></div>

        <!-- Tarjeta de Resultados Finales -->
        <div id="resultsCard" class="results-card">
            <h3>Evaluación Finalizada</h3>
            <p id="scoreText"></p>
            <div id="resultStatus" class="msg-status"></div>
        </div>
    </div>

    <!-- Script conectado a Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLSIGdkd2y1l7zhMjoVd_bmCj8jjXpX4I",
          authDomain: "aula-virtual-mas-alla-del-pris.firebaseapp.com",
          projectId: "aula-virtual-mas-alla-del-pris",
          storageBucket: "aula-virtual-mas-alla-del-pris.firebasestorage.app",
          messagingSenderId: "711745866832",
          appId: "1:711745866832:web:945e046cb0b61ac320d555"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Definición de las preguntas basadas estrictamente en el material adjunto del Capítulo 6
        const preguntas = [
            {
                id: 1,
                pregunta: "¿Cómo caracteriza el texto el nuevo escenario del sufrimiento vincular en la era de la hiperconectividad[cite: 8]?",
                opciones: [
                    "Como una simple variante del encuentro furtivo de los cuerpos en el espacio físico y el ocultamiento geográfico.",
                    "Como un panóptico de bolsillo donde las pantallas y las redes sociales dinamitan los antiguos diques de la confianza conyugal[cite: 8].",
                    "Como un fenómeno puramente pasajero sin impacto real sobre la metapsicología del sujeto.",
                    "Como el resultado exclusivo de la falta de legislación sobre ciberdelitos conyugales.",
                    "Como un mecanismo idéntico a la represión de mociones homosexuales infantiles."
                ],
                correcta: 1,
                feedback: "Correcto. El nuevo territorio se estructura en torno a las pantallas y aplicaciones que funcionan como un panóptico de bolsillo que dinamita la confianza[cite: 8]."
            },
            {
                id: 2,
                pregunta: "Desde la perspectiva de la Clínica de la Convergencia, ¿cómo operan las pantallas en las infidelidades digitales[cite: 8]?",
                opciones: [
                    "Como meros instrumentos neutrales donde se consume un engaño sin consecuencias subjetivas.",
                    "Como prótesis defensivas frente a la alteridad y reguladores adictivos del desamparo narcisístico[cite: 8].",
                    "Como herramientas analíticas que facilitan la asociación libre y la cura psicoanalítica.",
                    "Como sustitutos permanentes y adecuados de la estructura edípica infantil.",
                    "Como un factor que neutraliza por completo la liberación de dopamina."
                ],
                correcta: 1,
                feedback: "Correcto. Las pantallas no son instrumentos neutrales; operan como prótesis defensivas frente a la alteridad y reguladores adictivos del desamparo[cite: 8]."
            },
            {
                id: 3,
                pregunta: "En la metapsicología del secreto digital, ¿qué fricción introduce el encuentro tradicional con el objeto amoroso real que la tecnología altera[cite: 8]?",
                opciones: [
                    "La ausencia absoluta de opacidades y límites en el otro.",
                    "El atravesamiento de la diferencia: el otro real posee un cuerpo, un tiempo, opacidades y límites que resisten a la omnipotencia narcisística del sujeto[cite: 8].",
                    "La garantía de gratificación inmediata sin ningún tipo de esfuerzo sostenido.",
                    "La eliminación total del deseo clandestino en el aparato psíquico.",
                    "La sincronización perfecta de los sistemas de recompensa dopaminérgicos."
                ],
                correcta: 1,
                feedback: "Correcto. El otro real posee opacidades y límites que resisten a la omnipotencia narcisística, fricción que es alterada por la infidelidad digital[cite: 8]."
            },
            {
                id: 4,
                pregunta: "¿Qué características asume el intercambio erótico en el entorno de las aplicaciones y chats virtuales según el texto[cite: 8]?",
                opciones: [
                    "Se somete estrictamente a las exigencias materiales, el envejecimiento y la presencia real de los cuerpos.",
                    "Se convierte en un objeto a la carta y descorporizado, una representación idealizada del otro completamente editada sin la densidad material cotidiana[cite: 8].",
                    "Exige una negociación constante y tolerancia rigurosa a la frustración.",
                    "Elimina por completo la ilusión de control omnipotente en el yo.",
                    "Requiere la exposición directa y sostenida del propio cuerpo."
                ],
                correcta: 1,
                feedback: "Correcto. El entorno digital permite acceder a un intercambio erótico descorporizado y editado, libre de la densidad material y el envejecimiento[cite: 8]."
            },
            {
                id: 5,
                pregunta: "Cuando se descubre el secreto digital, ¿cuál es el impacto metapsicológico profundo sobre el sujeto damnificado más allá de la transgresión sexual[cite: 8]?",
                opciones: [
                    "Una reorganización pacífica del aparato psíquico orientada al perdón inmediato.",
                    "Una demolición de la realidad psíquica compartida, con resignificación retroactiva de la historia y desorganización aguda del yo (intemperie traumática)[cite: 8].",
                    "La activación automática de los circuitos prefrontales de empatía y razonamiento abstracto.",
                    "La confirmación de fantasías edípicas infantiles placenteras.",
                    "La restitución inmediata de la confianza conyugal a través de la palabra."
                ],
                correcta: 1,
                feedback: "Correcto. El descubrimiento destruye la arquitectura de la realidad compartida, resignificando retroactivamente la historia y arrojando al yo a una intemperie traumática[cite: 8]."
            },
            {
                id: 6,
                pregunta: "Desde el punto de vista neurobiológico, ¿bajo qué principio operan las interacciones en el ámbito digital (mensajes imprevistos, likes, secretos compartidos)[cite: 8]?",
                opciones: [
                    "Bajo el principio de gratificación diferida y esfuerzo sostenido.",
                    "Bajo el principio de los refuerzos de razón variable (incertidumbre maximizadora que eleva la liberación de dopamina)[cite: 8].",
                    "Bajo la regulación estricta de la corteza prefrontal dorsolateral.",
                    "Bajo la inhibición absoluta del núcleo accumbens y el sistema mesolímbico.",
                    "Bajo parámetros de habituación subcortical inmediata."
                ],
                correcta: 1,
                feedback: "Correcto. Las interacciones digitales operan bajo refuerzos de razón variable (similares a las máquinas tragamonedas), maximizando la dopamina y la incertidumbre[cite: 8]."
            },
            {
                id: 7,
                pregunta: "Qué diferencia fundamental establece el cuadro comparativo del texto entre el Vínculo Digital y el Vínculo Real[cite: 8]?",
                opciones: [
                    "El vínculo digital exige negociación y esfuerzo sostenido, mientras que el real ofrece gratificación inmediata.",
                    "El vínculo digital ofrece gratificación inmediata, refuerzo variable, objeto idealizado, control omnipotente y sin fricción; el real implica gratificación diferida, esfuerzo sostenido, alteridad real, negociación y tolerancia a la frustración[cite: 8].",
                    "El vínculo real carece de alteridad y se basa en el control omnipotente de la pantalla.",
                    "El vínculo digital se fundamenta en la tolerancia rigurosa a la frustración y la paciencia.",
                    "No existen diferencias neurobiológicas sustanciales entre ambos tipos de vínculos."
                ],
                correcta: 1,
                feedback: "Correcto. El vínculo digital se caracteriza por la gratificación inmediata, el control omnipotente y la ausencia de fricción, frente al esfuerzo, alteridad y negociación del vínculo real[cite: 8]."
            },
            {
                id: 8,
                pregunta: "¿Qué ocurre en el sistema nervioso del sujeto damnificado de inmediato al descubrirse el secreto digital[cite: 8]?",
                opciones: [
                    "Se produce un descenso autonómico inmediato y una sincronía perfecta de los ritmos biológicos.",
                    "Se experimenta un secuestro amigdalino masivo: la amígdala dispara, el eje HPA inunda el cuerpo de cortisol y adrenalina, y la corteza prefrontal dorsolateral se desconecta[cite: 8].",
                    "Se activa de manera óptima la habituación subcortical neutralizando el impacto.",
                    "Se suprimen por completo las respuestas de supervivencia y defensa.",
                    "Se consolida una respuesta reflexiva y analítica ante la crisis."
                ],
                correcta: 1,
                feedback: "Correcto. El descubrimiento provoca un secuestro amigdalino con descarga de cortisol y adrenalina, desconectando la corteza prefrontal y bloqueando el diálogo reflexivo[cite: 8]."
            },
            {
                id: 9,
                pregunta: "En la dinámica reactiva de la crisis conyugal tras el descubrimiento, ¿cómo interactúan típicamente ambos partenaires[cite: 8]?",
                opciones: [
                    "Mediante un intercambio verbal apacible, constructivo y simétrico.",
                    "El dolor y la furia del damnificado chocan contra la evitación defensiva o el aplanamiento del transgresor, atrapados en un circuito puramente reactivo[cite: 8].",
                    "A través de una elaboración metapsicológica inmediata sin interferencias somáticas.",
                    "Mediante la activación sincronizada de los circuitos de oxitocina y vasopresina benéfica.",
                    "Por medio de una tregua voluntaria que prescinde de cualquier intervención clínica."
                ],
                correcta: 1,
                feedback: "Correcto. La pareja queda atrapada en una dinámica reactiva donde el dolor del damnificado choca contra la evitación del transgresor debido al secuestro autonómico[cite: 8]."
            },
            {
                id: 10,
                pregunta: "Desde la óptica de la Clínica de la Convergencia, ¿qué exige rigurosamente esta crisis antes de intentar cualquier elaboración verbal o abordaje analítico profundo[cite: 8]?",
                opciones: [
                    "Una exigencia inmediata de explicaciones racionales sobre los chats ocultos.",
                    "Una intervención clínica orientada a la descompresión biológica y verbal del sustrato neurobiológico secuestrado[cite: 8].",
                    "La derivación psiquiátrica definitiva sin intervención analítica en pareja.",
                    "La revisión exhaustiva y conjunta de todas las aplicaciones de mensajería.",
                    "La aplicación de sanciones morales sobre el cónyuge infiel."
                ],
                correcta: 1,
                feedback: "Correcto. La clínica exige una intervención que descomprima primero el sustrato biológico antes de intentar cualquier elaboración verbal dada la desconexión prefrontal[cite: 8]."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = preguntas.length;

        function renderQuiz() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            preguntas.forEach((p, index) => {
                const card = document.createElement("div");
                card.className = `quiz-card ${index === 0 ? 'active' : ''}`;
                card.id = `question-card-${index}`;

                let opcionesHtml = "";
                p.opciones.forEach((opcion, optIndex) => {
                    opcionesHtml += `<button class="option-btn" onclick="verificarRespuesta(${index}, ${optIndex})">${opcion}</button>`;
                });

                card.innerHTML = `
                    <div class="question-number">Pregunta ${index + 1} de ${totalQuestions}</div>
                    <div class="question-title">${p.pregunta}</div>
                    <div class="options-list" id="options-${index}">
                        ${opcionesHtml}
                    </div>
                    <div class="feedback-box" id="feedback-${index}">${p.feedback}</div>
                    <div class="nav-actions">
                        <button class="btn-next" id="btn-next-${index}" onclick="siguientePregunta(${index})">
                            ${index === totalQuestions - 1 ? 'Finalizar Protocolo' : 'Siguiente Pregunta'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.verificarRespuesta = function(qIndex, selectedOpt) {
            const p = preguntas[qIndex];
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            const feedbackBox = document.getElementById(`feedback-${qIndex}`);
            const nextBtn = document.getElementById(`btn-next-${qIndex}`);

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === p.correcta) {
                    buttons[i].classList.add("correct");
                } else if (i === selectedOpt) {
                    buttons[i].classList.add("incorrect");
                }
            }

            if (selectedOpt === p.correcta) {
                score += 1;
                feedbackBox.className = "feedback-box show correct-fb";
            } else {
                feedbackBox.className = "feedback-box show incorrect-fb";
            }

            nextBtn.style.display = "block";
        }

        window.siguientePregunta = function(qIndex) {
            document.getElementById(`question-card-${qIndex}`).classList.remove("active");

            if (qIndex + 1 < totalQuestions) {
                document.getElementById(`question-card-${qIndex + 1}`).classList.add("active");
            } else {
                guardarYMostrarResultados();
            }
        }

        async function guardarYMostrarResultados() {
            document.getElementById("questionsContainer").style.display = "none";
            const resultsCard = document.getElementById("resultsCard");
            const scoreText = document.getElementById("scoreText");
            const resultStatus = document.getElementById("resultStatus");

            resultsCard.style.display = "block";
            scoreText.innerText = `Protocolo finalizado, Ud. ha obtenido ${score} puntos/10, se enviará a corrección definitiva`;

            const sessionData = sessionStorage.getItem("current_session");
            let userId = "Estudiante_Anonimo";
            
            if (sessionData) {
                try {
                    const userObj = JSON.parse(sessionData);
                    userId = userObj.user || userObj.name || "Estudiante";
                } catch (e) {
                    console.error("Error al parsear sesión:", e);
                }
            }

            const docId = `NOTA_TEST_6_${userId.replace(/[\.\s]/g, "_")}`;

            try {
                await setDoc(doc(db, "calificaciones_tests", docId), {
                    usuario: userId,
                    notaTest_6: score,
                    fecha: new Date().toISOString()
                });

                resultStatus.style.color = "#145a32";
                resultStatus.innerText = "¡Resultado guardado con éxito en la base de datos!";
            } catch (error) {
                console.error("Error al guardar en base de datos:", error);
                resultStatus.style.color = "#641e16";
                resultStatus.innerText = "Error al sincronizar el resultado con la base de datos.";
            }
        }

        window.volverDashboard = function() {
            if (window.parent && window.parent !== window) {
                window.parent.location.reload();
            } else {
                window.location.href = "index.html";
            }
        }

        window.onload = function() {
            renderQuiz();
        };
    </script>
</body>
</html>
