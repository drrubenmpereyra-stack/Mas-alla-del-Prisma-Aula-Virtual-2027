<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Más allá del Prisma - Aula Virtual</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- PANTALLA DE LOGIN --- */
        #login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border: 2px solid var(--border-color);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .login-logo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .login-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.5);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #d4e6f1;
            color: #1b4f72;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(212, 230, 241, 0.8);
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background-color: #a9cce3;
            box-shadow: 0 0 15px rgba(169, 204, 227, 1);
        }

        .login-footer {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

        .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* --- AULA VIRTUAL (DASHBOARD) --- */
        #app-container {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 50%;
            border: 1.5px solid var(--border-color);
        }

        .header-titles h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a252f;
        }

        .header-titles span {
            font-size: 0.8rem;
            color: #7f8c8d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .user-badge {
            font-size: 0.9rem;
            font-weight: 600;
            background: #eaeded;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #bdc3c7;
        }

        /* --- MENÚ DE NAVEGACIÓN --- */
        nav {
            background: #ffffff;
            border-bottom: 2px solid var(--border-color);
            padding: 12px 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: flex-start;
        }

        .nav-btn {
            padding: 8px 14px;
            border-radius: 6px;
            border: 2px solid #000000;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Colores Pastel y Glows */
        .btn-pastel-1 { background-color: #d1f2eb; box-shadow: 0 0 8px rgba(209, 242, 235, 0.8); color: #0e6251; }
        .btn-pastel-2 { background-color: #d4efdf; box-shadow: 0 0 8px rgba(212, 239, 223, 0.8); color: #145a32; }
        .btn-pastel-3 { background-color: #fcf3cf; box-shadow: 0 0 8px rgba(252, 243, 207, 0.8); color: #7d6608; }
        .btn-pastel-4 { background-color: #fdebd0; box-shadow: 0 0 8px rgba(253, 235, 208, 0.8); color: #7e5109; }
        .btn-pastel-5 { background-color: #f5b7b1; box-shadow: 0 0 8px rgba(245, 183, 177, 0.8); color: #641e16; }
        .btn-pastel-6 { background-color: #ebdef0; box-shadow: 0 0 8px rgba(235, 222, 240, 0.8); color: #512e5f; }
        .btn-pastel-7 { background-color: #e8daef; box-shadow: 0 0 8px rgba(232, 218, 239, 0.8); color: #4a235a; }
        .btn-pastel-8 { background-color: #d6eaf8; box-shadow: 0 0 8px rgba(214, 234, 248, 0.8); color: #1b4f72; }
        .btn-pastel-9 { background-color: #a9cce3; box-shadow: 0 0 8px rgba(169, 204, 227, 0.8); color: #154360; }
        .btn-pastel-10 { background-color: #f9e79f; box-shadow: 0 0 8px rgba(249, 231, 159, 0.8); color: #7d6608; }
        .btn-pastel-11 { background-color: #a3e4d7; box-shadow: 0 0 8px rgba(163, 228, 215, 0.8); color: #0b5345; }
        
        .btn-exit {
            background-color: #fadbd8;
            color: #78281f;
            box-shadow: 0 0 8px rgba(250, 219, 216, 0.8);
            margin-left: auto;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        /* --- WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            margin: 20px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            flex: 1;
            min-height: 600px;
        }

        /* Desplegables */
        .dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #ffffff;
            min-width: 180px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
            z-index: 10;
            border: 2px solid #000;
            border-radius: 6px;
            top: 100%;
            left: 0;
            margin-top: 5px;
        }

        .dropdown-content button {
            width: 100%;
            padding: 10px;
            text-align: left;
            background: none;
            border: none;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .dropdown-content button:hover {
            background-color: #f2f3f4;
        }

        .dropdown-container:hover .dropdown-content {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ================= PANTALLA DE LOGIN ================= -->
    <div id="login-container">
        <div class="login-card">
            <img src="logotipo.jpg" alt="Logotipo" class="login-logo" onerror="this.src='https://via.placeholder.com/110?text=Logo'">
            <h2 class="login-title">Más allá del prisma</h2>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
                <div id="errorMsg" class="error-msg">Usuario o contraseña incorrectos.</div>
            </form>

            <div class="login-footer">
                <p><strong>Dr. y Mgter. Rubén M. Pereyra</strong></p>
                <p>2027</p>
            </div>
        </div>
    </div>

    <!-- ================= AULA VIRTUAL (DASHBOARD) ================= -->
    <div id="app-container">
        <header>
            <div class="header-left">
                <img src="logotipo.jpg" alt="Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/50?text=Logo'">
                <div class="header-titles">
                    <h1>Mas allá del prisma</h1>
                    <span>Aula Virtual</span>
                </div>
            </div>
            <div id="userDisplay" class="user-badge">Panel</div>
        </header>

        <nav id="navMenu"></nav>

        <div class="workspace">
            <iframe id="contentFrame" name="contentFrame" src="about:blank"></iframe>
        </div>
    </div>

    <!-- Script Principal con la lógica y Firebase -->
    <script type="module" src="app.js"></script>
</body>
</html>
