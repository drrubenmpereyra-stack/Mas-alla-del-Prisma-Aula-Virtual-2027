<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual - Más Allá del Prisma</title>
    <style>
        :root {
            --bg-color: #eef2f7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --border-color: #1a252f;
            --primary-color: #880e4f;
            --accent-gold: #b7950b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        /* Canvas de fondo para la red neuronal animada */
        #neuralCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Contenedor general de la interfaz por encima del canvas */
        .ui-layer {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor del Login */
        .login-card {
            background: var(--card-bg);
            border: 2.5px solid var(--border-color);
            border-radius: 14px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .login-card h2 {
            font-size: 1.4rem;
            color: #1a252f;
            margin-bottom: 6px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .login-card p {
            font-size: 0.88rem;
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #2c3e50;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #ffffff;
            color: #2c3e50;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(136, 14, 79, 0.2);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(136, 14, 79, 0.3);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .error-msg {
            color: #c0392b;
            font-size: 0.85rem;
            font-weight: 700;
            margin-top: 12px;
            display: none;
        }

        /* Contenedor principal del Aula Virtual (Dashboard) inicialmente oculto */
        #app-container {
            display: none;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            background: rgba(244, 245, 247, 0.95);
        }

        header {
            background: #ffffff;
            border-bottom: 2px solid var(--border-color);
            padding: 12px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        aside {
            width: 280px;
            background: #ffffff;
            border-right: 2px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .workspace {
            flex: 1;
            background: #eef2f7;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        #contentFrame {
            width: 100%;
            height: 100%;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: #ffffff;
        }

        .nav-btn {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 14px;
            text-align: left;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background-color: #fcf3cf;
            border-color: var(--accent-gold);
        }

        .btn-exit {
            background-color: #fadbd8;
            color: #78281f;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- Canvas para la Red Neuronal y destellos de luces erráticas -->
    <canvas id="neuralCanvas"></canvas>

    <!-- Capa de Interfaz de Usuario -->
    <div class="ui-layer">
        
        <!-- Contenedor de Login -->
        <div id="login-container" class="login-card">
            <h2>Más Allá del Prisma</h2>
            <p>Aula Virtual 2027</p>
            <form id="loginForm">
                <div class="input-group">
                    <label for="usuario">Usuario / Apellido</label>
                    <input type="text" id="usuario" required autocomplete="off" placeholder="Ingrese su usuario">
                </div>
                <div class="input-group">
                    <label for="contrasena">Contraseña / Matrícula</label>
                    <input type="password" id="contrasena" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Ingresar al Sistema</button>
                <div id="errorMsg" class="error-msg">Credenciales incorrectas o usuario no registrado.</div>
            </form>
        </div>

        <!-- Contenedor Principal del Sistema (Dashboard) -->
        <div id="app-container">
            <header>
                <div id="userDisplay"></div>
                <div style="font-weight: 800; font-size: 1.1rem; color: #1a252f;">Campus Académico</div>
            </header>
            <div class="main-layout">
                <aside id="navMenu"></aside>
                <div class="workspace">
                    <iframe id="contentFrame" src="about:blank"></iframe>
                </div>
            </div>
        </div>

    </div>

    <!-- Script de Animación Neuronal y Lógica de Aplicación (app.js embebido o conectado) -->
    <script type="module" src="app.js"></script>

    <script>
        /* --- MOTOR DE RED NEURONAL Y NEUROGLIA CON DESTELLOS ERRÁTICOS --- */
        const canvas = document.getElementById('neuralCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let nodes = [];
        let pulses = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Constructor de Neuronas y Glía
        class Node {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = (Math.random() - 0.5) * 0.4;
                this.radius = Math.random() * 2.5 + 1.5;
                this.type = Math.random() > 0.2 ? 'neuron' : 'glia'; // Neuronas o Células gliales
                this.color = this.type === 'neuron' ? '#34495e' : '#2980b9';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Halo sutil para simular núcleo celular
                if(this.type === 'neuron') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 2, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(41, 128, 185, 0.15)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            }
        }

        // Destellos de luces de colores erráticos viajando por las sinapsis
        class Pulse {
            constructor(startNode, endNode) {
                this.x = startNode.x;
                this.y = startNode.y;
                this.startX = startNode.x;
                this.startY = startNode.y;
                this.endX = endNode.x;
                this.endY = endNode.y;
                this.progress = 0;
                this.speed = Math.random() * 0.015 + 0.008;
                
                // Colores erráticos de alta calidad (tonos cyan, magenta, oro, violeta eléctrico)
                const erraticColors = ['#e74c3c', '#9b59b6', '#f1c40f', '#00cec9', '#e84393', '#0984e3'];
                this.color = erraticColors[Math.floor(Math.random() * erraticColors.length)];
            }

            update() {
                this.progress += this.speed;
                this.x = this.startX + (this.endX - this.startX) * this.progress;
                this.y = this.startY + (this.endY - this.startY) * this.progress;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0; // Reset sombra
            }
        }

        // Inicializar cantidad óptima de nodos según resolución
        const density = Math.floor((width * height) / 14000);
        for (let i = 0; i < density; i++) {
            nodes.push(new Node());
        }

        function animate() {
            // Fondo tenuemente celeste dinámico
            ctx.fillStyle = '#e8f0fe';
            ctx.fillRect(0, 0, width, height);

            // Actualizar y dibujar conexiones sinápticas (red neuronal)
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].update();
                nodes[i].draw();

                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[i].x - nodes[j].x;
                    let dy = nodes[i].y - nodes[j].y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        let alpha = (1 - (dist / 130)) * 0.22;
                        ctx.strokeStyle = `rgba(38, 70, 83, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();

                        // Generar destellos erráticos aleatorios en las conexiones
                        if (Math.random() < 0.0012 && pulses.length < 25) {
                            pulses.push(new Pulse(nodes[i], nodes[j]));
                        }
                    }
                }
            }

            // Actualizar y renderizar destellos de luces erráticas
            for (let p = pulses.length - 1; p >= 0; p--) {
                pulses[p].update();
                pulses[p].draw();
                if (pulses[p].progress >= 1) {
                    pulses.splice(p, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
