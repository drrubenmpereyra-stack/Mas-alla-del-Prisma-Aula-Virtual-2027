<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test 1 - Neuropsicoanálisis de la Sublimación y el Arte</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .btn-volver {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #fadbd8;
            color: #78281f;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(250, 219, 216, 0.8);
            transition: all 0.2s ease;
        }

        .btn-volver:hover {
            transform: translateY(-2px);
            filter: brightness(0.95);
        }

        header h2 {
            font-size: 1.5rem;
            color: #1a252f;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 10px;
            margin-bottom: 8px;
            margin-top: 40px;
        }

        header p {
            font-size: 0.95rem;
            color: #7d6608;
            font-weight: 600;
        }

        .quiz-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            display: none;
        }

        .quiz-card.active {
            display: block;
        }

        .question-number {
            font-size: 0.85rem;
            font-weight: 700;
            color: #7d6608;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 12px 16px;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 600;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: #fcf3cf;
            border-color: #7d6608;
        }

        .option-btn.correct {
            background-color: #d4efdf !important;
            color: #145a32 !important;
            border-color: #145a32 !important;
            box-shadow: 0 0 10px rgba(212, 239, 223, 0.9);
        }

        .option-btn.incorrect {
            background-color: #f5b7b1 !important;
            color: #641e16 !important;
            border-color: #641e16 !important;
            box-shadow: 0 0 10px rgba(245, 183, 177, 0.9);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 14px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            display: none;
        }

        .feedback-box.show {
            display: block;
        }

        .feedback-box.correct-fb {
            background-color: #d4efdf;
            color: #145a32;
            border: 1.5px solid #145a32;
        }

        .feedback-box.incorrect-fb {
            background-color: #f9d5d2;
            color: #641e16;
            border: 1.5px solid #641e16;
        }

        .nav-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn-next {
            background-color: #d4efdf;
            color: #145a32;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(212, 239, 223, 0.8);
            display: none;
            transition: all 0.2s ease;
        }

        .btn-next:hover {
            background-color: #a9dfbf;
        }

        .results-card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: none;
        }

        .results-card h3 {
            font-size: 1.6rem;
            color: #1a252f;
            margin-bottom: 15px;
        }

        .results-card p {
            font-size: 1.1rem;
            color: #7d6608;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .msg-status {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <button class="btn-volver" onclick="volverDashboard()">← Volver</button>
            <h2>Test 1: Neuropsicoanálisis de la Sublimación y el Arte</h2>
            <p>Programa de Formación para Profesionales de la Salud Mental (2027)</p>
        </header>

        <!-- Contenedor del Cuestionario -->
        <div id="questionsContainer"></div>

        <!-- Tarjeta de Resultados Finales -->
        <div id="resultsCard" class="results-card">
            <h3>Evaluación Finalizada</h3>
            <p id="scoreText"></p>
            <div id="resultStatus" class="msg-status"></div>
        </div>
    </div>

    <!-- Script conectado a Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLSIGdkd2y1l7zhMjoVd_bmCj8jjXpX4I",
          authDomain: "aula-virtual-mas-alla-del-pris.firebaseapp.com",
          projectId: "aula-virtual-mas-alla-del-pris",
          storageBucket: "aula-virtual-mas-alla-del-pris.firebasestorage.app",
          messagingSenderId: "711745866832",
          appId: "1:711745866832:web:945e046cb0b61ac320d555"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Definición de las preguntas basadas estrictamente en el material adjunto del Capítulo 1
        const preguntas = [
            {
                id: 1,
                pregunta: "¿Cómo definió Sigmund Freud fundamentalmente el mecanismo de la sublimación[cite: 2]?",
                opciones: [
                    "Como una forma de represión exitosa sobre los impulsos agresivos.",
                    "Como el destino singular de la pulsión que desvía la energía sexual hacia objetos socialmente valorados, científicos, éticos o estéticos sin mediación de represión[cite: 2].",
                    "Como un mecanismo de defensa puramente adaptativo y biológico frente al estrés ambiental.",
                    "Como una regresión voluntaria al servicio del yo en la cura psicoanalítica.",
                    "Como una descarga motriz directa de fantasías primordiales reprimidas."
                ],
                correcta: 1,
                feedback: "Correcto. Freud definió la sublimación como un destino singular de la pulsión que desvía la energía hacia cauces valorados socialmente o estéticamente sin pagar el costo del síntoma[cite: 2]."
            },
            {
                id: 2,
                pregunta: "¿Qué posición adopta la 'Clínica de la Convergencia' frente al estudio de la creación artística[cite: 2]?",
                opciones: [
                    "Adopta el purismo hermenéutico clásico desestimando la base corporal del fenómeno.",
                    "Reduce la obra de arte a un epifenómeno de la descarga dopaminérgica sináptica.",
                    "Rechaza tanto el reduccionismo biologicista como el aislamiento hermenéutico, construyendo un puente epistemológico riguroso[cite: 2].",
                    "Sustituye por completo los conceptos metapsicológicos por la neurobiología funcional.",
                    "Considera que la neurología y el psicoanálisis son dominios completamente incomunicables."
                ],
                correcta: 2,
                feedback: "Correcto. La Clínica de la Convergencia rechaza ambos reduccionismos y postula un puente epistemológico entre metapsicología y neuropsicología funcional[cite: 2]."
            },
            {
                id: 3,
                pregunta: "¿Qué dimensiones metapsicológicas cruciales operan en el proceso de la sublimación[cite: 2]?",
                opciones: [
                    "La anulación total de la libido, la represión primaria y el acting out.",
                    "La economía del desplazamiento, el estatuto de la pérdida y la falta, y el paso del proceso primario al secundario[cite: 2].",
                    "La condensación delirante, la desexualización completa del yo y la regresión tópica.",
                    "La descarga alucinatoria del deseo, la escisión del yo y el aislamiento afectivo.",
                    "La hiperactivación simpática, la inhibición motora y el refugio fantasmático."
                ],
                correcta: 1,
                feedback: "Correcto. Las tres dimensiones metapsicológicas clave son la economía del desplazamiento, el estatuto de la pérdida/falta y el paso del proceso primario al secundario[cite: 2]."
            },
            {
                id: 4,
                pregunta: "En relación a la Red de Modo por Defecto (Default Mode Network - DMN), el texto señala que[cite: 2]:",
                opciones: [
                    "Se activa únicamente cuando el sujeto ejecuta tareas orientadas al mundo exterior utilitario.",
                    "Es el correlato neurofuncional del proceso primario, encargada de la libre asociación espontánea y la ensoñación[cite: 2].",
                    "Funciona de manera idéntica a la Red de Ejecución Central (CEN).",
                    "Es la responsable exclusiva de la ejecución técnica y formal de la obra artística.",
                    "Bloquea sistemáticamente la memoria autobiográfica para evitar el trauma."
                ],
                correcta: 1,
                feedback: "Correcto. La DMN es el correlato del proceso primario, encargada de la libre asociación, la recombinación de la memoria y la ensoñación desacoplada de la inmediatez[cite: 2]."
            },
            {
                id: 5,
                pregunta: "¿Qué sucede cuando un sujeto queda atrapado exclusivamente en la hiperactividad de la DMN sin mediación de otras redes[cite: 2]?",
                opciones: [
                    "Se produce de forma inmediata una obra de arte sublimatoria de alta calidad.",
                    "El resultado no es arte, sino rumiación melancólica, delirio psicótico o secuestro ansioso en el trauma[cite: 2].",
                    "Se alcanza un estado de equilibrio adaptativo perfecto con el entorno social.",
                    "Se activa la Red de Ejecución Central de manera automática.",
                    "Se anulan por completo las formaciones del inconsciente."
                ],
                correcta: 1,
                feedback: "Correcto. Sin la mediación de otras redes, el predominio aislado de la DMN conduce a la rumiación, el delirio o el secuestro en el trauma[cite: 2]."
            },
            {
                id: 6,
                pregunta: "¿Cuál es la función específica de la Red de Salinencia (Salience Network) en el proceso creador[cite: 2]?",
                opciones: [
                    "Aportar la focalización atencional y la disciplina técnica sobre el material.",
                    "Detectar qué estímulos internos o externos son relevantes, filtrando qué contenidos merecen ser llevados a la conciencia y estetizados[cite: 2].",
                    "Ejecutar el trabajo motor sobre el mármol, las palabras o los pigmentos.",
                    "Impedir cualquier tipo de comunicación entre el mundo interno y el exterior.",
                    "Sustituir al inconsciente freudiano por esquemas cognitivos rígidos."
                ],
                correcta: 1,
                feedback: "Correcto. La Red de Salinencia detecta estímulos relevantes y actúa como filtro para llevar contenidos del mundo interno hacia la conciencia y la estetización[cite: 2]."
            },
            {
                id: 7,
                pregunta: "¿Qué rol desempeña la Red de Ejecución Central (Central Executive Network - CEN) en la sublimación[cite: 2]?",
                opciones: [
                    "Generar las ensoñaciones pasivas propias del proceso primario.",
                    "Aportar la focalización atencional, el dominio técnico, la disciplina material y la ejecución formal[cite: 2].",
                    "Bloquear el acceso de la libido hacia objetos socialmente compartidos.",
                    "Sustituir el trabajo de figuración por la descarga motriz directa.",
                    "Mantener al sujeto en un estado permanente de libre asociación."
                ],
                correcta: 1,
                feedback: "Correcto. La CEN aporta la focalización atencional, el dominio técnico y la disciplina material necesarios para la ejecución formal[cite: 2]."
            },
            {
                id: 8,
                pregunta: "Cuando el trauma es masivo y violenta las defensas psíquicas, ¿cómo se altera la DMN según el texto[cite: 2]?",
                opciones: [
                    "Aumenta su flexibilidad asociativa y su plasticidad creadora de manera exponencial.",
                    "Se hiperconecta de forma rígida, dejando al sujeto prisionero de memorias traumáticas hiperconsistentes sin distancia temporal[cite: 2].",
                    "Desaparece por completo de la actividad cerebral observable.",
                    "Se sincroniza perfectamente con la Red de Salinencia para metabolizar el afecto.",
                    "Se desacopla totalmente de la memoria autobiográfica permitiendo el olvido."
                ],
                correcta: 1,
                feedback: "Correcto. El trauma rigidiza la conectividad de la DMN, atrapando al sujeto en memorias hiperconsistentes sin la distancia temporal del inconsciente[cite: 2]."
            },
            {
                id: 9,
                pregunta: "¿De qué manera actúa la obra de arte frente al desborde traumático[cite: 2]?",
                opciones: [
                    "Como un tóxico que acelera la desintegración del aparato psíquico.",
                    "Como una prótesis somatosensorial y un dique significante que calma la descarga autonómica e inscribe un sentido nuevo en el campo del Otro[cite: 2].",
                    "Como un sustituto farmacológico que bloquea definitivamente la actividad sináptica.",
                    "Como un mecanismo de represión secundaria que borra el rastro mnemónico.",
                    "Como una vía de escape para el acting out sin valor de comunicación social."
                ],
                correcta: 1,
                feedback: "Correcto. La obra actúa como prótesis somatosensorial y dique significante, calmando al cuerpo e inscribiendo nuevo sentido en el campo del Otro[cite: 2]."
            },
            {
                id: 10,
                pregunta: "¿Qué relación funcional existe entre el Proceso Primario metapsicológico y la neurofisiología[cite: 2]?",
                opciones: [
                    "Se corresponde con la Red de Ejecución Central y el control inhibitorio.",
                    "Se corresponde con la Red de Modo por Defecto (DMN), caracterizada por el repliegue libidinal y la libre circulación de imágenes mnémicas[cite: 2].",
                    "Se homologa estrictamente con la función de la Red de Salinencia.",
                    "No guarda ninguna relación con la actividad de las redes corticales profundas.",
                    "Representa el funcionamiento adaptativo y utilitario del cerebro externo."
                ],
                correcta: 1,
                feedback: "Correcto. El proceso primario y la fantasía inconsciente encuentran su correlato en la DMN, marcada por la libre circulación de representaciones[cite: 2]."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        const totalQuestions = preguntas.length;

        function renderQuiz() {
            const container = document.getElementById("questionsContainer");
            container.innerHTML = "";

            preguntas.forEach((p, index) => {
                const card = document.createElement("div");
                card.className = `quiz-card ${index === 0 ? 'active' : ''}`;
                card.id = `question-card-${index}`;

                let opcionesHtml = "";
                p.opciones.forEach((opcion, optIndex) => {
                    opcionesHtml += `<button class="option-btn" onclick="verificarRespuesta(${index}, ${optIndex})">${opcion}</button>`;
                });

                card.innerHTML = `
                    <div class="question-number">Pregunta ${index + 1} de ${totalQuestions}</div>
                    <div class="question-title">${p.pregunta}</div>
                    <div class="options-list" id="options-${index}">
                        ${opcionesHtml}
                    </div>
                    <div class="feedback-box" id="feedback-${index}">${p.feedback}</div>
                    <div class="nav-actions">
                        <button class="btn-next" id="btn-next-${index}" onclick="siguientePregunta(${index})">
                            ${index === totalQuestions - 1 ? 'Finalizar Protocolo' : 'Siguiente Pregunta'}
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.verificarRespuesta = function(qIndex, selectedOpt) {
            const p = preguntas[qIndex];
            const optionsContainer = document.getElementById(`options-${qIndex}`);
            const buttons = optionsContainer.getElementsByClassName("option-btn");
            const feedbackBox = document.getElementById(`feedback-${qIndex}`);
            const nextBtn = document.getElementById(`btn-next-${qIndex}`);

            for (let i = 0; i < buttons.length; i++) {
                buttons[i].disabled = true;
                if (i === p.correcta) {
                    buttons[i].classList.add("correct");
                } else if (i === selectedOpt) {
                    buttons[i].classList.add("incorrect");
                }
            }

            if (selectedOpt === p.correcta) {
                score += 1;
                feedbackBox.className = "feedback-box show correct-fb";
            } else {
                feedbackBox.className = "feedback-box show incorrect-fb";
            }

            nextBtn.style.display = "block";
        }

        window.siguientePregunta = function(qIndex) {
            document.getElementById(`question-card-${qIndex}`).classList.remove("active");

            if (qIndex + 1 < totalQuestions) {
                document.getElementById(`question-card-${qIndex + 1}`).classList.add("active");
            } else {
                guardarYMostrarResultados();
            }
        }

        async function guardarYMostrarResultados() {
            document.getElementById("questionsContainer").style.display = "none";
            const resultsCard = document.getElementById("resultsCard");
            const scoreText = document.getElementById("scoreText");
            const resultStatus = document.getElementById("resultStatus");

            resultsCard.style.display = "block";
            scoreText.innerText = `Protocolo finalizado, Ud. ha obtenido ${score}puntos/10, se enviará a corrección definitiva`;

            const sessionData = sessionStorage.getItem("current_session");
            let userId = "Estudiante_Anonimo";
            
            if (sessionData) {
                try {
                    const userObj = JSON.parse(sessionData);
                    userId = userObj.user || userObj.name || "Estudiante";
                } catch (e) {
                    console.error("Error al parsear sesión:", e);
                }
            }

            const docId = `NOTA_TEST_1_${userId.replace(/[\.\s]/g, "_")}`;

            try {
                await setDoc(doc(db, "calificaciones_tests", docId), {
                    usuario: userId,
                    notaTest_1: score,
                    fecha: new Date().toISOString()
                });

                resultStatus.style.color = "#145a32";
                resultStatus.innerText = "¡Resultado guardado con éxito en la base de datos!";
            } catch (error) {
                console.error("Error al guardar en base de datos:", error);
                resultStatus.style.color = "#641e16";
                resultStatus.innerText = "Error al sincronizar el resultado con la base de datos.";
            }
        }

        window.volverDashboard = function() {
            if (window.parent && window.parent !== window) {
                window.parent.location.reload();
            } else {
                window.location.href = "index.html";
            }
        }

        window.onload = function() {
            renderQuiz();
        };
    </script>
</body>
</html>
