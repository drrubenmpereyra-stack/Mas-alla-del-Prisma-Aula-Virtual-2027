<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talleres - Vista Estudiantes</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        h2 {
            font-size: 1.4rem;
            color: #1a252f;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 10px;
        }

        .card {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #7d6608;
        }

        select {
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
            cursor: pointer;
        }

        .viewer-container {
            width: 100%;
            height: 600px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder-text {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Talleres - Visualizador de Instructivos</h2>

        <!-- Selector de Talleres -->
        <div class="card">
            <div class="form-group">
                <label for="tallerSelect">Seleccione el Taller a Visualizar:</label>
                <select id="tallerSelect" onchange="cargarVisorGoogle()">
                    <option value="">-- Cargando talleres disponibles --</option>
                </select>
            </div>
        </div>

        <!-- Visor Incrustado para PDF de Google -->
        <div class="card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: #7d6608;">Vista Previa del Instructivo</h3>
            <div class="viewer-container" id="visorContainer">
                <div class="placeholder-text">Seleccione un taller en el selector superior para cargar su vista previa.</div>
            </div>
        </div>
    </div>

    <!-- Script conectado a Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLSIGdkd2y1l7zhMjoVd_bmCj8jjXpX4I",
          authDomain: "aula-virtual-mas-alla-del-pris.firebaseapp.com",
          projectId: "aula-virtual-mas-alla-del-pris",
          storageBucket: "aula-virtual-mas-alla-del-pris.firebasestorage.app",
          messagingSenderId: "711745866832",
          appId: "1:711745866832:web:945e046cb0b61ac320d555"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const GITHUB_BASE_URL = "https://drrubenmpereyra-stack.github.io/Mas-alla-del-Prisma-Aula-Virtual-2027/";

        window.onload = function() {
            poblarSelectTalleres();
        };

        // Cargar los talleres publicados desde Firebase hacia el selector
        async function poblarSelectTalleres() {
            const select = document.getElementById("tallerSelect");
            try {
                const querySnapshot = await getDocs(collection(db, "talleres"));
                select.innerHTML = '<option value="">-- Seleccione un taller --</option>';

                if (querySnapshot.empty) {
                    select.innerHTML = '<option value="">No hay talleres disponibles actualmente</option>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const m = docSnap.data();
                    const opt = document.createElement("option");
                    // Guardamos la URL completa directa en el valor de la opción
                    opt.value = GITHUB_BASE_URL + m.archivo;
                    opt.textContent = m.titulo;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error al cargar talleres:", error);
                select.innerHTML = '<option value="">Error al cargar los datos</option>';
            }
        }

        // Función para incrustar el visor de Google Docs con la URL del PDF seleccionado
        window.cargarVisorGoogle = function() {
            const select = document.getElementById("tallerSelect");
            const urlPdf = select.value;
            const container = document.getElementById("visorContainer");

            if (!urlPdf) {
                container.innerHTML = '<div class="placeholder-text">Seleccione un taller en el selector superior para cargar su vista previa.</div>';
                return;
            }

            // Integración del visor de Google Docs para incrustar PDF de forma segura
            const googleViewerUrl = `https://docs.google.com/gview?url=${encodeURIComponent(urlPdf)}&embedded=true`;
            container.innerHTML = `<iframe src="${googleViewerUrl}" title="Visor de Taller"></iframe>`;
        }
    </script>
</body>
</html>
