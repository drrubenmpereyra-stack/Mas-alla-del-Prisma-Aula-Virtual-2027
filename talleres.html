<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Talleres - Administrador</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #1a252f;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 10px;
        }

        .form-card {
            background-color: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #7d6608;
        }

        .form-group input, .form-group select {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background-color: #d4efdf;
            color: #145a32;
            box-shadow: 0 0 8px rgba(212, 239, 223, 0.8);
        }

        .btn-save:hover {
            background-color: #a9dfbf;
        }

        .table-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        th {
            background-color: #eaeded;
            font-weight: 700;
            color: #2c3e50;
            border-bottom: 2px solid var(--border-color);
        }

        .btn-delete {
            background-color: #f5b7b1;
            color: #641e16;
            padding: 6px 10px;
            font-size: 0.8rem;
            border: 1.5px solid #000;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete:hover {
            filter: brightness(0.9);
        }

        .msg-status {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gestión de Talleres - Instructivos PDF</h2>

        <div class="form-card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem; color: #7d6608;">Registrar / Sincronizar Instructivo de Taller</h3>
            <form id="tallerForm" onsubmit="guardarMaterial(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tituloMaterial">Título del Taller:</label>
                        <input type="text" id="tituloMaterial" required placeholder="Ej: Taller 1 o Taller Preliminar">
                    </div>
                    <div class="form-group">
                        <label for="nombreArchivo">Nombre exacto del archivo en GitHub:</label>
                        <input type="text" id="nombreArchivo" required placeholder="Ej: Taller 1.pdf o Taller_preliminar.pdf">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Guardar Registro</button>
                </div>
                <div id="msgStatus" class="msg-status"></div>
            </form>
        </div>

        <div class="table-card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Instructivos de Talleres Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Archivo en Repositorio</th>
                        <th>Acceso Directo</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaMateriales">
                    <tr>
                        <td colspan="4" style="text-align: center; color: #7f8c8d;">Cargando instructivos desde la base de datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLSIGdkd2y1l7zhMjoVd_bmCj8jjXpX4I",
          authDomain: "aula-virtual-mas-alla-del-pris.firebaseapp.com",
          projectId: "aula-virtual-mas-alla-del-pris",
          storageBucket: "aula-virtual-mas-alla-del-pris.firebasestorage.app",
          messagingSenderId: "711745866832",
          appId: "1:711745866832:web:945e046cb0b61ac320d555"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // URL base de tu GitHub Pages para los instructivos de talleres
        const GITHUB_BASE_URL = "https://drrubenmpereyra-stack.github.io/Mas-alla-del-Prisma-Aula-Virtual-2027/";

        window.onload = function() {
            cargarMateriales();
        };

        window.guardarMaterial = async function(event) {
            event.preventDefault();
            const titulo = document.getElementById("tituloMaterial").value.trim();
            const archivo = document.getElementById("nombreArchivo").value.trim();
            const msgStatus = document.getElementById("msgStatus");

            // Cambiamos la colección de Firestore a "talleres" para mantenerlo separado de la biblioteca
            const docId = "TALLER_" + archivo.replace(/[\.\s]/g, "_");

            try {
                await setDoc(doc(db, "talleres", docId), {
                    titulo,
                    archivo
                });

                msgStatus.style.color = "#145a32";
                msgStatus.innerText = "¡Instructivo de taller guardado con éxito!";
                
                document.getElementById("tallerForm").reset();
                cargarMateriales();

                setTimeout(() => { msgStatus.innerText = ""; }, 4000);
            } catch (error) {
                console.error("Error al guardar taller:", error);
                msgStatus.style.color = "#641e16";
                msgStatus.innerText = "Error al guardar en la base de datos.";
            }
        }

        async function cargarMateriales() {
            const tbody = document.getElementById("tablaMateriales");
            try {
                const querySnapshot = await getDocs(collection(db, "talleres"));
                tbody.innerHTML = "";

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #7f8c8d;">No hay instructivos de talleres registrados todavía.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const m = docSnap.data();
                    const fullUrl = GITHUB_BASE_URL + m.archivo;
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${m.titulo}</strong></td>
                        <td><code>${m.archivo}</code></td>
                        <td><a href="${fullUrl}" target="_blank" style="color: #1b4f72; font-weight: 600;">📄 Abrir PDF</a></td>
                        <td>
                            <button class="btn-delete" onclick="eliminarMaterial('${docSnap.id}')">Eliminar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar talleres:", error);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #641e16;">Error al cargar datos de Firebase.</td></tr>`;
            }
        }

        window.eliminarMaterial = async function(docId) {
            if (confirm("¿Estás seguro de eliminar este registro del taller?")) {
                try {
                    await deleteDoc(doc(db, "talleres", docId));
                    cargarMateriales();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("No se pudo eliminar el registro.");
                }
            }
        }
    </script>
</body>
</html>
