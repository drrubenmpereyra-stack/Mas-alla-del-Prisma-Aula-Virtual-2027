<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Participantes</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --neural-pattern: radial-gradient(circle, rgba(200,205,215,0.25) 1px, transparent 1px);
            --card-bg: #ffffff;
            --border-color: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--neural-pattern);
            background-size: 24px 24px;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #1a252f;
            border-bottom: 2px solid #bdc3c7;
            padding-bottom: 10px;
        }

        /* Formulario con el estilo de color del botón 4 (#fdebd0) */
        .form-card {
            background-color: #fdebd0;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 0 12px rgba(253, 235, 208, 0.9);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #7e5109;
        }

        .form-group input {
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            outline: none;
        }

        .form-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-save {
            background-color: #d4efdf;
            color: #145a32;
            box-shadow: 0 0 8px rgba(212, 239, 223, 0.8);
        }

        .btn-save:hover {
            background-color: #a9dfbf;
        }

        .btn-cancel {
            background-color: #fadbd8;
            color: #78281f;
            display: none;
        }

        /* Tabla de Vista General */
        .table-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #eaeded;
            font-weight: 700;
            color: #2c3e50;
            border-bottom: 2px solid var(--border-color);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background-color: #fcf3cf;
            color: #7d6608;
            padding: 6px 10px;
            font-size: 0.8rem;
            border: 1.5px solid #000;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #f5b7b1;
            color: #641e16;
            padding: 6px 10px;
            font-size: 0.8rem;
            border: 1.5px solid #000;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-edit:hover, .btn-delete:hover {
            filter: brightness(0.9);
        }

        .msg-status {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Gestión de Participantes (Estudiantes)</h2>

        <!-- Formulario de Registro / Edición -->
        <div class="form-card">
            <form id="participanteForm" onsubmit="guardarParticipante(event)">
                <input type="hidden" id="participanteId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" required>
                    </div>
                    <div class="form-group">
                        <label for="nombres">Nombres:</label>
                        <input type="text" id="nombres" required>
                    </div>
                    <div class="form-group">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" required>
                    </div>
                    <div class="form-group">
                        <label for="telefono">Teléfono:</label>
                        <input type="text" id="telefono" required>
                    </div>
                    <div class="form-group">
                        <label for="codigoMatricula">Código de Matrícula:</label>
                        <input type="text" id="codigoMatricula" required placeholder="Ej: MAT-2027-01">
                    </div>
                    <div class="form-group">
                        <label for="fotoDrive">Link Foto (Google Drive):</label>
                        <input type="url" id="fotoDrive" placeholder="https://drive.google.com/...">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save" id="btnGuardar">Guardar Participante</button>
                    <button type="button" class="btn btn-cancel" id="btnCancelar" onclick="limpiarFormulario()">Cancelar Edición</button>
                </div>
                <div id="msgStatus" class="msg-status"></div>
            </form>
        </div>

        <!-- Vista General (Tabla) -->
        <div class="table-card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Participantes Registrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Apellidos y Nombres</th>
                        <th>DNI</th>
                        <th>Teléfono</th>
                        <th>Matrícula</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaParticipantes">
                    <tr>
                        <td colspan="5" style="text-align: center; color: #7f8c8d;">Cargando participantes desde la base de datos...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script conectado a Firebase Firestore -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLSIGdkd2y1l7zhMjoVd_bmCj8jjXpX4I",
          authDomain: "aula-virtual-mas-alla-del-pris.firebaseapp.com",
          projectId: "aula-virtual-mas-alla-del-pris",
          storageBucket: "aula-virtual-mas-alla-del-pris.firebasestorage.app",
          messagingSenderId: "711745866832",
          appId: "1:711745866832:web:945e046cb0b61ac320d555"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.onload = function() {
            cargarParticipantes();
        };

        // Guardar o actualizar participante
        window.guardarParticipante = async function(event) {
            event.preventDefault();
            const idDoc = document.getElementById("participanteId").value;
            const apellido = document.getElementById("apellido").value.trim();
            const nombres = document.getElementById("nombres").value.trim();
            const dni = document.getElementById("dni").value.trim();
            const telefono = document.getElementById("telefono").value.trim();
            const codigoMatricula = document.getElementById("codigoMatricula").value.trim();
            const fotoDrive = document.getElementById("fotoDrive").value.trim();
            const msgStatus = document.getElementById("msgStatus");

            const docId = idDoc ? idDoc : "PART_" + dni;

            try {
                // Guardar en la colección "participantes"
                await setDoc(doc(db, "participantes", docId), {
                    apellido,
                    nombres,
                    dni,
                    telefono,
                    codigoMatricula,
                    fotoDrive
                });

                msgStatus.style.color = "#145a32";
                msgStatus.innerText = "¡Participante guardado con éxito en la base de datos!";
                
                limpiarFormulario();
                cargarParticipantes();

                setTimeout(() => { msgStatus.innerText = ""; }, 4000);
            } catch (error) {
                console.error("Error al guardar:", error);
                msgStatus.style.color = "#641e16";
                msgStatus.innerText = "Error al guardar en la base de datos.";
            }
        }

        // Obtener y mostrar todos los participantes
        async function cargarParticipantes() {
            const tbody = document.getElementById("tablaParticipantes");
            try {
                const querySnapshot = await getDocs(collection(db, "participantes"));
                tbody.innerHTML = "";

                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #7f8c8d;">No hay participantes registrados todavía.</td></tr>`;
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const p = docSnap.data();
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
                        <td><strong>${p.apellido}</strong>, ${p.nombres}</td>
                        <td>${p.dni}</td>
                        <td>${p.telefono}</td>
                        <td>${p.codigoMatricula}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="prepararEdicion('${docSnap.id}', '${p.apellido}', '${p.nombres}', '${p.dni}', '${p.telefono}', '${p.codigoMatricula}', '${p.fotoDrive || ''}')">Editar</button>
                                <button class="btn-delete" onclick="eliminarParticipante('${docSnap.id}')">Eliminar</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar participantes:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #641e16;">Error al cargar datos de Firebase.</td></tr>`;
            }
        }

        // Cargar datos en el formulario para editar
        window.prepararEdicion = function(docId, apellido, nombres, dni, telefono, codigoMatricula, fotoDrive) {
            document.getElementById("participanteId").value = docId;
            document.getElementById("apellido").value = apellido;
            document.getElementById("nombres").value = nombres;
            document.getElementById("dni").value = dni;
            document.getElementById("telefono").value = telefono;
            document.getElementById("codigoMatricula").value = codigoMatricula;
            document.getElementById("fotoDrive").value = fotoDrive;

            document.getElementById("btnGuardar").innerText = "Actualizar Participante";
            document.getElementById("btnCancelar").style.display = "inline-block";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Eliminar participante de Firestore
        window.eliminarParticipante = async function(docId) {
            if (confirm("¿Estás seguro de eliminar este participante de forma definitiva?")) {
                try {
                    await deleteDoc(doc(db, "participantes", docId));
                    cargarParticipantes();
                } catch (error) {
                    console.error("Error al eliminar:", error);
                    alert("No se pudo eliminar el registro.");
                }
            }
        }

        // Limpiar formulario y resetear estados
        window.limpiarFormulario = function() {
            document.getElementById("participanteForm").reset();
            document.getElementById("participanteId").value = "";
            document.getElementById("btnGuardar").innerText = "Guardar Participante";
            document.getElementById("btnCancelar").style.display = "none";
        }
    </script>
</body>
</html>
